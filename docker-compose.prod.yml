# Production-oriented compose overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  db:
    ports: []

  backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  frontend:
    ports:
      - "80:8080"
